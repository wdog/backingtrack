    repeat: 2
    chords: "| Dm7 | % | % | % | % | % | % | % |"
  - name: B
    chords: "| Ebm7 | % | % | % | % | % | % | % |"
  - name: A finale
    chords: "| Dm7 | % | % | % | % | % | % | % |"

arrangement: [A x2, B, A finale, A x2, B, A finale]
