# Miles Davis, 1959 (Kind of Blue). Jazz modale: re dorico e mib dorico, AABA di 32 battute.
# Solo la progressione di accordi (niente melodia né testo), a scopo didattico.
title: "So What (progressione)"
tempo: 136
groove: jazz/charleston

sections:
