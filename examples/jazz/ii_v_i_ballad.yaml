# Esercizio: ii-V-I maggiore e minore in do, in ballad, per studiare i voicing.
# Solo la progressione di accordi (niente melodia né testo), a scopo didattico.
title: "ii-V-I in C (ballad)"
tempo: 66
groove: jazz/ballad

sections:
